name: Release Test Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Run Backend Tests
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pytest backend/tests

      - name: Build Frontend Production Bundle
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Package Standalone Test Build Archive
        run: |
          TAG_NAME="${{ github.ref_name }}"
          [ -z "$TAG_NAME" ] && TAG_NAME="v1.0.0"
          mkdir -p release-pkg/vera-test-build
          cp -r backend release-pkg/vera-test-build/
          mkdir -p release-pkg/vera-test-build/frontend
          cp -r frontend/dist release-pkg/vera-test-build/frontend/dist
          cp run.bat run.sh .env.example README.md LICENSE Dockerfile .dockerignore release-pkg/vera-test-build/
          cd release-pkg
          zip -r "../vera-test-build-${TAG_NAME}.zip" vera-test-build
          cd ..

      - name: Publish GitHub Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: vera-test-build-*.zip
          name: "Vera ${{ github.ref_name }} — Test Build Release"
          draft: false
          prerelease: false
          generate_release_notes: true
